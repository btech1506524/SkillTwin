services:
  - type: web
    name: skilltwin-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DB_HOST
        value: iriguchi.proxy.rlwy.net
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: railway
      - key: DB_PORT
        value: 38169
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: certs/railway-mysql-ca.pem
