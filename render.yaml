services:
  - type: web
    name: skilltwin-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: OAUTH_FRONTEND_URL
        value: https://skill-twin-orpin.vercel.app
      - key: OAUTH_BACKEND_URL
        value: https://skilltwin-l25l.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: DB_HOST
        value: iriguchi.proxy.rlwy.net
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: railway
      - key: DB_PORT
        value: 38169
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: certs/railway-mysql-ca.pem
