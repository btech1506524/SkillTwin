services:
  - type: web
    name: skilltwin-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm --prefix backend ci && npm run build && npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_SSL
        value: "true"
